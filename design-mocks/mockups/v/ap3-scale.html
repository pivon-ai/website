<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approach — 0→100 scale</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{background:var(--paper)}
  .svc{padding:var(--section-y) 0}
  .svc-head{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);margin-bottom:56px}
  .svc-head h2{font-size:clamp(2rem,4.5vw,3.1rem);margin-top:14px;max-width:16ch}
  .scale{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);position:relative}
  .ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;
    letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin-bottom:10px}
  .rail{height:8px;border-radius:var(--r-pill);position:relative;
    background:linear-gradient(90deg,#22C7F2,#2F6BEC,#7A3CEE,#E5258E)}
  .stops{display:grid;grid-template-columns:repeat(4,1fr);margin-top:0}
  .stop{position:relative;padding:30px 14px 0;text-align:center}
  .stop::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--violet)}
  .stop:nth-child(1)::before{border-color:#22C7F2}
  .stop:nth-child(2)::before{border-color:#2F6BEC}
  .stop:nth-child(3)::before{border-color:#7A3CEE}
  .stop:nth-child(4)::before{border-color:#E5258E}
  .num{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,3.6vw,3rem);letter-spacing:-.04em;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
  .stop h3{font-size:1.25rem;margin:0 0 8px}
  .stop p{color:var(--slate);font-size:.92rem;margin:0}
  @media (max-width:760px){
    .rail{height:auto;width:8px;min-height:420px;position:absolute;left:calc(var(--gutter) + 8px);top:36px;
      background:linear-gradient(180deg,#22C7F2,#2F6BEC,#7A3CEE,#E5258E)}
    .ends{display:none}
    .stops{grid-template-columns:1fr;margin-left:46px}
    .stop{text-align:left;padding:0 0 34px}
    .stop::before{top:4px;left:-46px;transform:none}
  }
</style>
</head>
<body>
<section class="svc">
  <header class="svc-head">
    <span class="eyebrow">How we work</span>
    <h2>From zero to AI-native, on a clear track.</h2>
  </header>
  <div class="scale">
    <div class="ends"><span>Zero</span><span>AI-native · yours</span></div>
    <div class="rail"></div>
    <div class="stops">
      <div class="stop"><div class="num">00</div><h3>Discover</h3><p>We learn your business, data, and constraints.</p></div>
      <div class="stop"><div class="num">01</div><h3>Evaluate</h3><p>Rank and cost the use cases.</p></div>
      <div class="stop"><div class="num">02</div><h3>Build</h3><p>Design, build, ship.</p></div>
      <div class="stop"><div class="num">100</div><h3>Handover</h3><p>Train your team; we leave, it stays.</p></div>
    </div>
  </div>
</section>
</body>
</html>
