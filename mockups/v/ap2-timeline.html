<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approach — Vertical timeline</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{background:var(--paper)}
  .svc{padding:var(--section-y) 0}
  .svc-head{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);margin-bottom:48px}
  .svc-head h2{font-size:clamp(2rem,4.5vw,3.1rem);margin-top:14px;max-width:16ch}
  .steps{max-width:820px;margin-inline:auto;padding-inline:var(--gutter);position:relative}
  .line{position:absolute;left:calc(var(--gutter) + 6px);top:18px;bottom:34px;width:2px;
    background:linear-gradient(180deg,#22C7F2,#2F6BEC,#7A3CEE,#E5258E)}
  .step{position:relative;padding:0 0 42px 56px}
  .step:last-child{padding-bottom:0}
  .step::before{content:"";position:absolute;left:1px;top:8px;width:12px;height:12px;border-radius:50%;
    background:var(--paper);border:2px solid var(--violet)}
  .num{font-family:var(--f-display);font-weight:700;font-size:1.9rem;letter-spacing:-.04em;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
  .content h3{font-size:1.5rem;margin:0 0 6px}
  .content p{color:var(--slate);font-size:1rem;margin:0}
  @media (max-width:620px){.step{padding-left:48px}}
</style>
</head>
<body>
<section class="svc">
  <header class="svc-head">
    <span class="eyebrow">How we work</span>
    <h2>From zero to AI-native, on a clear track.</h2>
  </header>
  <div class="steps">
    <span class="line"></span>
    <div class="step">
      <div class="num">00</div>
      <div class="content"><h3>Discover</h3><p>We learn your business, data, and constraints.</p></div>
    </div>
    <div class="step">
      <div class="num">01</div>
      <div class="content"><h3>Evaluate</h3><p>Rank and cost the use cases.</p></div>
    </div>
    <div class="step">
      <div class="num">02</div>
      <div class="content"><h3>Build</h3><p>Design, build, ship.</p></div>
    </div>
    <div class="step">
      <div class="num">100</div>
      <div class="content"><h3>Handover</h3><p>Train your team; we leave, it stays.</p></div>
    </div>
  </div>
</section>
</body>
</html>
