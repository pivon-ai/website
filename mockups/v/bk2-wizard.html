<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking — Stepped wizard</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{background:var(--paper-2)}
  .svc{padding:var(--section-y) 0}
  .head{max-width:640px;margin:0 auto 36px;padding-inline:var(--gutter);text-align:center}
  .head .eyebrow{justify-content:center}
  .head h2{font-size:clamp(2rem,4vw,2.8rem);margin:14px 0 10px}
  .head p{color:var(--slate);margin:0}
  .card{max-width:640px;margin-inline:auto;padding-inline:0;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
  .stepper{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .stepper div{padding:16px;text-align:center;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;color:var(--mist);position:relative}
  .stepper div.done{color:var(--slate)}
  .stepper div.active{color:var(--ink)}
  .stepper div.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad)}
  .stepper .n{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;align-items:center;justify-content:center;margin-right:.5em;border:1px solid var(--line-2)}
  .stepper .active .n{color:#fff;background:var(--ink);border-color:transparent}
  .body{padding:28px}
  .chosen{display:inline-flex;align-items:center;gap:.6em;font-family:var(--f-mono);font-size:.8rem;color:var(--ink);
    padding:.5em .9em;border-radius:var(--r-pill);background:var(--paper-2);border:1px solid var(--line);margin-bottom:22px}
  .chosen a{color:var(--violet);text-decoration:none}
  .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);margin:0 0 14px}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .chips .chip{justify-content:center;padding:.7em 0}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  @media (max-width:560px){.chips{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<section class="svc">
  <div class="head">
    <span class="eyebrow">Let's talk</span>
    <h2>Start the first run.</h2>
    <p>30 min · no slides · the honest version.</p>
  </div>
  <div class="card">
    <div class="stepper">
      <div class="done"><span class="n">✓</span>Date</div>
      <div class="active"><span class="n">2</span>Time</div>
      <div><span class="n">3</span>Details</div>
    </div>
    <div class="body">
      <span class="chosen">Thu 9 July 2026 <a href="#">change</a></span>
      <p class="lab">Pick a time — 30-minute slots</p>
      <div class="chips">
        <span class="chip">09:00</span><span class="chip" style="opacity:.4">09:30</span><span class="chip active-chip">10:00</span><span class="chip">11:30</span>
        <span class="chip">13:30</span><span class="chip">14:00</span><span class="chip" style="opacity:.4">15:30</span><span class="chip">16:30</span>
      </div>
      <div class="foot">
        <a href="#" style="font-family:var(--f-mono);font-size:.8rem;color:var(--slate);text-decoration:none">‹ back</a>
        <button class="btn btn-primary"><span>Continue →</span></button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
