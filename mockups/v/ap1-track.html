<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approach — Horizontal track</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{background:var(--paper)}
  .svc{padding:var(--section-y) 0}
  .svc-head{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);margin-bottom:60px}
  .svc-head h2{font-size:clamp(2rem,4.5vw,3.1rem);margin-top:14px;max-width:16ch}
  .track{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);
    display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative}
  .line{position:absolute;left:var(--gutter);right:var(--gutter);top:34px;height:2px;
    background:linear-gradient(90deg,#22C7F2,#2F6BEC,#7A3CEE,#E5258E);z-index:0}
  .step{position:relative;z-index:1}
  .node{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--violet);
    margin:27px auto 28px;position:relative}
  .step:nth-child(2) .node{border-color:#22C7F2}
  .step:nth-child(3) .node{border-color:#2F6BEC}
  .step:nth-child(4) .node{border-color:#7A3CEE}
  .step:nth-child(5) .node{border-color:#E5258E}
  .num{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,4vw,3.2rem);letter-spacing:-.04em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;line-height:1;margin-bottom:14px}
  .step h3{font-size:1.3rem;text-align:center;margin:0 0 8px}
  .step p{color:var(--slate);font-size:.95rem;text-align:center;margin:0}
  @media (max-width:760px){
    .track{grid-template-columns:auto 1fr;gap:0 24px}
    .line{left:calc(var(--gutter) + 6px);right:auto;top:var(--gutter);bottom:var(--gutter);width:2px;height:auto;
      background:linear-gradient(180deg,#22C7F2,#2F6BEC,#7A3CEE,#E5258E)}
    .step{display:contents}
    .node{grid-column:1;margin:34px 0 0;justify-self:center}
    .num{grid-column:2;grid-row:auto;text-align:left;margin:24px 0 6px}
    .step h3,.step p{grid-column:2;text-align:left}
    .step p{margin-bottom:8px}
  }
</style>
</head>
<body>
<section class="svc">
  <header class="svc-head">
    <span class="eyebrow">How we work</span>
    <h2>From zero to AI-native, on a clear track.</h2>
  </header>
  <div class="track">
    <span class="line"></span>
    <div class="step">
      <div class="node"></div><div class="num">00</div>
      <h3>Discover</h3><p>We learn your business, data, and constraints.</p>
    </div>
    <div class="step">
      <div class="node"></div><div class="num">01</div>
      <h3>Evaluate</h3><p>Rank and cost the use cases.</p>
    </div>
    <div class="step">
      <div class="node"></div><div class="num">02</div>
      <h3>Build</h3><p>Design, build, ship.</p>
    </div>
    <div class="step">
      <div class="node"></div><div class="num">100</div>
      <h3>Handover</h3><p>Train your team; we leave, it stays.</p>
    </div>
  </div>
</section>
</body>
</html>
