<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking — Two-pane</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{background:var(--paper-2)}
  .svc{padding:var(--section-y) 0}
  .head{max-width:var(--container);margin:0 auto 32px;padding-inline:var(--gutter)}
  .head h2{font-size:clamp(2rem,4vw,2.8rem);margin:14px 0 8px}
  .head p{color:var(--slate);margin:0}
  .card{max-width:var(--container);margin-inline:auto;padding-inline:0;width:calc(100% - 2*var(--gutter));
    margin-left:var(--gutter);margin-right:var(--gutter);
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);
    display:grid;grid-template-columns:1fr 1fr}
  .pane{padding:28px}
  .pane.left{border-right:1px solid var(--line)}
  .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);margin:0 0 14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head b{font-family:var(--f-display);font-size:1rem}
  .cal-head button{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--slate)}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow span{font-family:var(--f-mono);font-size:.62rem;color:var(--mist);text-align:center;padding-bottom:4px}
  .grid button{aspect-ratio:1;border:0;background:var(--paper-2);border-radius:9px;font-family:var(--f-body);font-size:.86rem;color:var(--ink);cursor:pointer}
  .grid button:disabled{color:var(--line-2);background:transparent}
  .grid button.sel{color:#fff;background:var(--ink)}
  .grid button.sel{background:var(--grad)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
  .chips .chip{font-size:.76rem}
  .field{margin-bottom:12px}
  .field input,.field select,.field textarea{width:100%;font-family:var(--f-body);font-size:.92rem;
    padding:.7em .85em;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--paper);color:var(--ink)}
  .field textarea{min-height:64px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .submit{margin-top:6px;width:100%;justify-content:center}
  @media (max-width:780px){.card{grid-template-columns:1fr}.pane.left{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<section class="svc">
  <div class="head">
    <span class="eyebrow">Let's talk</span>
    <h2>Start the first run.</h2>
    <p>A 30-minute discovery call — no slides, the honest version. Pick a slot; we confirm by email.</p>
  </div>
  <div class="card">
    <div class="pane left">
      <p class="lab">Step 1 · Date</p>
      <div class="cal-head"><button aria-label="Previous month">‹</button><b>July 2026</b><button aria-label="Next month">›</button></div>
      <div class="dow"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
      <div class="grid">
        <button disabled></button><button disabled></button><button>1</button><button>2</button><button>3</button><button disabled>4</button><button disabled>5</button>
        <button>6</button><button>7</button><button>8</button><button class="sel">9</button><button>10</button><button disabled>11</button><button disabled>12</button>
        <button>13</button><button>14</button><button>15</button><button>16</button><button>17</button><button disabled>18</button><button disabled>19</button>
        <button>20</button><button>21</button><button>22</button><button>23</button><button>24</button><button disabled>25</button><button disabled>26</button>
        <button>27</button><button>28</button><button>29</button><button>30</button><button>31</button><button disabled></button><button disabled></button>
      </div>
    </div>
    <div class="pane right">
      <p class="lab">Step 2 · Thu 9 July — time</p>
      <div class="chips">
        <span class="chip">09:00</span><span class="chip" style="opacity:.4">09:30</span><span class="chip active-chip">10:00</span><span class="chip">11:30</span><span class="chip">13:30</span><span class="chip">14:00</span><span class="chip">16:30</span>
      </div>
      <p class="lab">Step 3 · Details</p>
      <div class="field"><input placeholder="Your name"></div>
      <div class="field"><input placeholder="Work email"></div>
      <div class="row2"><div class="field"><input placeholder="Company"></div><div class="field"><select><option>Team size</option><option>1–10</option><option>11–50</option><option>51–200</option><option>200+</option></select></div></div>
      <div class="field"><textarea placeholder="What do you want to talk about?"></textarea></div>
      <button class="btn btn-primary submit"><span>Book the call →</span></button>
    </div>
  </div>
</section>
</body>
</html>
