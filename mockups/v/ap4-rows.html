<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approach — Broadsheet rows</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{background:var(--paper)}
  .svc{padding:var(--section-y) 0}
  .svc-head{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);margin-bottom:32px}
  .svc-head h2{font-size:clamp(2rem,4.5vw,3.1rem);margin-top:14px;max-width:16ch}
  .list{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);position:relative}
  .thread{position:absolute;left:calc(var(--gutter) + 38px);top:60px;bottom:60px;width:2px;
    background:linear-gradient(180deg,#22C7F2,#2F6BEC,#7A3CEE,#E5258E)}
  .item{display:grid;grid-template-columns:150px 1fr;gap:40px;align-items:baseline;
    padding:36px 0;border-top:2px solid var(--ink)}
  .item:last-child{border-bottom:2px solid var(--ink)}
  .num{font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,5vw,3.6rem);letter-spacing:-.045em;line-height:.9;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .content{display:grid;grid-template-columns:1fr 1.4fr;gap:32px;align-items:baseline}
  .content h3{font-size:clamp(1.6rem,3vw,2.2rem);margin:0;letter-spacing:-.03em}
  .content p{color:var(--slate);font-size:1.02rem;margin:0}
  @media (max-width:760px){
    .thread{display:none}
    .item{grid-template-columns:1fr;gap:10px;padding:28px 0}
    .content{grid-template-columns:1fr;gap:8px}
  }
</style>
</head>
<body>
<section class="svc">
  <header class="svc-head">
    <span class="eyebrow">How we work</span>
    <h2>From zero to AI-native, on a clear track.</h2>
  </header>
  <div class="list">
    <span class="thread"></span>
    <div class="item">
      <div class="num">00</div>
      <div class="content"><h3>Discover</h3><p>We learn your business, data, and constraints.</p></div>
    </div>
    <div class="item">
      <div class="num">01</div>
      <div class="content"><h3>Evaluate</h3><p>Rank and cost the use cases.</p></div>
    </div>
    <div class="item">
      <div class="num">02</div>
      <div class="content"><h3>Build</h3><p>Design, build, ship.</p></div>
    </div>
    <div class="item">
      <div class="num">100</div>
      <div class="content"><h3>Handover</h3><p>Train your team; we leave, it stays.</p></div>
    </div>
  </div>
</section>
</body>
</html>
